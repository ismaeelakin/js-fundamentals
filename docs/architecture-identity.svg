<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490" role="img" aria-labelledby="title desc"><title id="title">Array exercise data flow</title><desc id="desc">Validated custom input takes one of four array-operation paths and is checked for nonfinite results before rendering.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#174c9b"/></marker></defs><rect width="1100" height="490" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif" fill="#172e52" color="#172e52"><rect x="0" y="0" width="1100" height="70" fill="#174c9b" stroke="none" stroke-dasharray=""/><text x="30" y="45" font-size="26" fill="#fff" font-weight="bold" text-anchor="start">ARRAY EXERCISE / TRANSFORMATION PATH</text><rect x="30" y="105" width="230" height="100" fill="#edf3fc" stroke="#8ca3c5" stroke-dasharray=""/><text x="48" y="140" font-size="24" fill="#172e52" font-weight="bold" text-anchor="start">Input text</text><text x="48" y="170" font-size="15" fill="#172e52" font-weight="normal" text-anchor="start">Split and validate numbers</text><path d="M260 155 H318" fill="none" stroke="#174c9b" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="110" width="310" height="65" fill="#fff" stroke="#174c9b" stroke-dasharray=""/><text x="397" y="137" font-size="20" fill="#174c9b" font-weight="bold" text-anchor="start">Summary</text><text x="397" y="161" font-size="15" fill="#172e52" font-weight="normal" text-anchor="start">Count, sum and mean</text><path d="M320 142 H378" fill="none" stroke="#174c9b" stroke-width="2" marker-end="url(#arrow)"/><path d="M690 142 H740" stroke="#174c9b" fill="none"/><rect x="380" y="190" width="310" height="65" fill="#fff" stroke="#174c9b" stroke-dasharray=""/><text x="397" y="217" font-size="20" fill="#174c9b" font-weight="bold" text-anchor="start">Unique</text><text x="397" y="241" font-size="15" fill="#172e52" font-weight="normal" text-anchor="start">Keep first occurrence</text><path d="M320 222 H378" fill="none" stroke="#174c9b" stroke-width="2" marker-end="url(#arrow)"/><path d="M690 222 H740" stroke="#174c9b" fill="none"/><rect x="380" y="270" width="310" height="65" fill="#fff" stroke="#174c9b" stroke-dasharray=""/><text x="397" y="297" font-size="20" fill="#174c9b" font-weight="bold" text-anchor="start">Sort</text><text x="397" y="321" font-size="15" fill="#172e52" font-weight="normal" text-anchor="start">Numeric ascending order</text><path d="M320 302 H378" fill="none" stroke="#174c9b" stroke-width="2" marker-end="url(#arrow)"/><path d="M690 302 H740" stroke="#174c9b" fill="none"/><rect x="380" y="350" width="310" height="65" fill="#fff" stroke="#174c9b" stroke-dasharray=""/><text x="397" y="377" font-size="20" fill="#174c9b" font-weight="bold" text-anchor="start">Double</text><text x="397" y="401" font-size="15" fill="#172e52" font-weight="normal" text-anchor="start">Map every value × 2</text><path d="M320 382 H378" fill="none" stroke="#174c9b" stroke-width="2" marker-end="url(#arrow)"/><path d="M690 382 H740" stroke="#174c9b" fill="none"/><path d="M320 143 V382 M740 143 V382" stroke="#174c9b" fill="none"/><path d="M740 262 H800" fill="none" stroke="#174c9b" stroke-width="2" marker-end="url(#arrow)"/><rect x="815" y="210" width="250" height="105" fill="#174c9b" stroke="none" stroke-dasharray=""/><text x="835" y="245" font-size="22" fill="#fff" font-weight="bold" text-anchor="start">Finite result?</text><text x="835" y="275" font-size="16" fill="#fff" font-weight="normal" text-anchor="start">Render JSON as text</text><text x="30" y="460" font-size="16" fill="#172e52" font-weight="normal" text-anchor="start">No eval, packages or network requests. Overflow produces an error instead of a misleading result.</text></g></svg>
